name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project and verification tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest ruff build

      - name: Unit and integration tests
        run: python -m pytest -p no:zarr -q

      - name: Lint maintained entry points
        run: |
          ruff check blood_culture_sentinel.py cli.py             blood_culture_early_alert_agent/cli.py             blood_culture_early_alert_agent/__init__.py

      - name: Package build
        run: python -m build

      - name: Dependency consistency
        run: python -m pip check

      - name: Installed CLI smoke test
        run: |
          blood-culture-early-alert-agent batch -i sample.csv -o out_smoke.csv
          test -s out_smoke.csv
          rm out_smoke.csv

      - name: Browser JavaScript syntax check
        run: node --check docs/app.js
