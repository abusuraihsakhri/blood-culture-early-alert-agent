[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "blood-culture-early-alert-engine"
version = "2.0.0"
description = "BloodCulture Sentinel: Time-to-Positivity & True Pathogen vs Contaminant Arbiter"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
blood-culture-early-alert-engine = "blood_culture_early_alert_agent.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/blood-culture-early-alert-engine"
Repository = "https://github.com/abusuraihsakhri/blood-culture-early-alert-engine.git"
